<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>瞬时歌荐 · 冷启动推荐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            background: #1a232e;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        .page-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.35s ease-in-out, visibility 0s linear 0.35s;
            overflow-y: auto;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .page.active {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.35s ease-in-out, visibility 0s linear 0s;
            z-index: 10;
        }

        .page::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 24, 32, 0.6);
            backdrop-filter: blur(2px);
            z-index: 0;
            pointer-events: none;
        }

        .card {
            position: relative;
            z-index: 2;
            max-width: 540px;
            width: 100%;
            background: rgba(248, 250, 252, 0.94);
            backdrop-filter: blur(14px);
            border-radius: 36px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.25), 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 245, 0.25);
        }

        .cover-card {
            text-align: center;
            background: rgba(245, 245, 240, 0.94);
            backdrop-filter: blur(14px);
        }

        .cover-title-large {
            font-size: 3.6rem;
            font-weight: 600;
            letter-spacing: 8px;
            color: #1e2a32;
            padding: 48px 20px 30px;
            line-height: 1.2;
        }

        .start-btn {
            background: #2c3e4e;
            border: none;
            border-radius: 60px;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            width: calc(100% - 56px);
            margin: 20px auto 40px;
            display: block;
            cursor: pointer;
        }

        .question-header {
            padding: 28px 28px 12px;
            border-bottom: 1px solid rgba(80, 100, 115, 0.2);
        }

        .q-step {
            font-size: 0.7rem;
            font-weight: 600;
            color: #2c6e6e;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .question-text {
            font-size: 1.6rem;
            font-weight: 550;
            line-height: 1.35;
            color: #1e2a36;
            padding: 12px 0 8px;
        }

        .options-area {
            padding: 24px 28px 28px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .option-item {
            background: rgba(255, 255, 245, 0.85);
            border: 1px solid rgba(90, 110, 125, 0.25);
            border-radius: 60px;
            padding: 15px 20px;
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            cursor: pointer;
        }

        .option-item.selected {
            background: #2c3e4e;
            color: white;
        }

        .next-btn {
            margin: 8px 28px 32px;
            background: rgba(255,255,245,0.9);
            border: 1px solid rgba(80, 100, 115, 0.5);
            border-radius: 44px;
            padding: 14px 0;
            font-size: 1rem;
            font-weight: 600;
            color: #2c5f6e;
            text-align: center;
            cursor: pointer;
        }

        .next-btn.active {
            background: #2c3e4e;
            color: white;
        }

        .next-btn.inactive {
            opacity: 0.5;
            pointer-events: none;
        }

        .rec-card {
            background: rgba(250, 250, 248, 0.95);
        }

        .poster-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #1e2a32;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .song-poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .poster-placeholder {
            font-size: 2.5rem;
            color: #a0b8cc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
        }

        .rec-info {
            padding: 24px 28px 28px;
        }

        .rec-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #2c6e6e;
            margin-bottom: 8px;
        }

        .song-name {
            font-size: 2rem;
            font-weight: 650;
            color: #1e2f3a;
            margin-bottom: 4px;
        }

        .song-artist {
            font-size: 1rem;
            color: #4a6272;
            margin-bottom: 16px;
        }

        .audio-player {
            margin: 12px 0;
        }
        .audio-player audio {
            width: 100%;
            border-radius: 40px;
            height: 46px;
        }

        .action-buttons {
            display: flex;
            gap: 16px;
            margin: 8px 0;
        }
        .action-btn {
            flex: 1;
            background: rgba(240, 245, 250, 0.9);
            border: 1px solid rgba(70, 100, 115, 0.4);
            border-radius: 60px;
            padding: 12px 0;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
        }
        .action-btn.listen-btn {
            background: #2c3e4e;
            color: white;
        }
        .action-btn.leave-btn {
            background: rgba(220, 225, 230, 0.85);
            color: #4a5f6e;
        }

        .philosophy-quote {
            font-size: 0.9rem;
            line-height: 1.45;
            color: #2c4e62;
            background: rgba(245, 245, 240, 0.75);
            padding: 14px 18px;
            border-radius: 24px;
            margin: 14px 0;
            border-left: 3px solid #8da9b9;
        }

        .rec-desc {
            font-size: 0.85rem;
            color: #466472;
            border-top: 1px solid rgba(100, 120, 130, 0.25);
            padding-top: 16px;
        }

        .reset-link {
            margin-top: 18px;
            display: inline-block;
            background: rgba(245, 245, 240, 0.8);
            border: 1px solid rgba(90, 110, 120, 0.5);
            border-radius: 40px;
            padding: 10px 24px;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .footer-note {
            text-align: center;
            font-size: 0.6rem;
            color: #7c93a3;
            margin-top: 12px;
            padding-top: 8px;
        }
    </style>
</head>
<body>
<div class="page-viewport">
    <div class="page active" id="page1" style="background-image: url('https://picsum.photos/id/104/1200/1600');">
        <div class="card cover-card">
            <div class="cover-title-large">瞬时歌荐</div>
            <button class="start-btn" id="startBtn">开始测评</button>
        </div>
    </div>

    <div class="page" id="page2" style="background-image: url('https://picsum.photos/id/29/1200/1600');">
        <div class="card">
            <div class="question-header">
                <div class="q-step">问题 1 / 2</div>
                <div class="question-text">你今天听歌的场景是偏向学习、休闲的安静场景吗？</div>
            </div>
            <div class="options-area" id="q1Options">
                <div class="option-item" data-q1="yes">是，安静场景（学习/休闲）</div>
                <div class="option-item" data-q1="no">否，动态场景（通勤/运动）</div>
            </div>
            <div class="next-btn inactive" id="toQ2Btn">下一步</div>
        </div>
    </div>

    <div class="page" id="page3" style="background-image: url('https://picsum.photos/id/42/1200/1600');">
        <div class="card">
            <div class="question-header">
                <div class="q-step">问题 2 / 2</div>
                <div class="question-text" id="dynamicQuestionText">你今天更想听带歌词的演唱类歌曲吗？</div>
            </div>
            <div class="options-area" id="q2Options"></div>
            <div class="next-btn inactive" id="toResultBtn">查看推荐</div>
        </div>
    </div>

    <div class="page" id="page4" style="background-image: url('https://picsum.photos/id/15/1200/1600');">
        <div class="card rec-card">
            <div class="poster-container" id="posterContainer">
                <div class="poster-placeholder" id="posterPlaceholder">🎵 唱片封面</div>
                <img id="songPoster" class="song-poster" style="display: none;" alt="歌曲海报">
            </div>
            <div class="rec-info">
                <div class="rec-label">为你推荐 · 冷启动匹配</div>
                <div class="song-name" id="recSongName">-</div>
                <div class="song-artist" id="recArtist">-</div>
                <div class="audio-player" id="audioPlayerContainer" style="display: none;">
                    <audio id="songAudio" controls preload="metadata"></audio>
                </div>
                <div class="action-buttons">
                    <button class="action-btn listen-btn" id="listenTrackBtn">🎧 点击听取</button>
                    <button class="action-btn leave-btn" id="leaveTrackBtn">🚪 离开</button>
                </div>
                <div class="philosophy-quote" id="philosophyQuote">音乐是灵魂的镜像，此刻的旋律映照你内心的风景。</div>
                <div class="rec-desc" id="recDesc">根据你的两个选择，精准推送契合度最高的歌曲。</div>
                <div><span class="reset-link" id="resetAllBtn">⟳ 重新评测</span></div>
            </div>
            <div class="footer-note">基于问卷先验 · 双问动态分群 | 数据汇总至腾讯文档</div>
        </div>
    </div>
</div>

<script>
    // ================= 配置区域 =================
    const STATS_ENDPOINT = "https://docs.qq.com/form/page/DRXV2aFdTZWRxa29U#/fill?entry.1={song}&entry.2={action}&entry.3={group}";

    let userChoice = { q1: null, q2: null };

    const SONG_MEDIA = {
        "小幸运": {
            posterUrl: "https://picsum.photos/id/29/500/500",
            audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
        },
        "River Flows in You": {
            posterUrl: "https://picsum.photos/id/104/500/500",
            audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
        },
        "孤勇者": {
            posterUrl: "https://picsum.photos/id/42/500/500",
            audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
        },
        "大风吹": {
            posterUrl: "https://picsum.photos/id/15/500/500",
            audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"
        }
    };

    const PHILOSOPHY_TEXTS = {
        "小幸运": "青春是一场大雨，即使感冒了，也盼望回头再淋它一次。",
        "River Flows in You": "钢琴如流水，静谧中藏着最深的温柔。",
        "孤勇者": "谁说站在光里的才算英雄？",
        "大风吹": "岁月如风，吹散浮华留下真实。"
    };

    const RECOMMENDATION_MAP = {
        C11: { songName: "小幸运", artist: "田馥甄", description: "安静场景 · 演唱类 · 治愈内省" },
        C10: { songName: "River Flows in You", artist: "Yiruma", description: "安静场景 · 纯音乐 · 冥想之河" },
        C01: { songName: "孤勇者", artist: "陈奕迅", description: "动态场景 · 热血燃志 · 孤勇前行" },
        C00: { songName: "大风吹", artist: "刘惜君", description: "动态场景 · 复古非热血 · 自在如风" }
    };

    function getUserGroupKey(q1, q2Bool) {
        const isQuiet = (q1 === 'yes');
        if (isQuiet) return q2Bool ? 'C11' : 'C10';
        return q2Bool ? 'C01' : 'C00';
    }

    // 上报函数：跳转到腾讯文档（数据预填）
    async function reportToPublisher(song, action, group) {
        let finalUrl = STATS_ENDPOINT
            .replace("{song}", encodeURIComponent(song))
            .replace("{action}", encodeURIComponent(action))
            .replace("{group}", encodeURIComponent(group));
        console.log("📡 打开腾讯文档:", finalUrl);
        window.open(finalUrl, "_blank");
    }

    function recordActionAndReport(songName, actionType, groupKey) {
        reportToPublisher(songName, actionType, groupKey);
        if (actionType === 'listen') {
            const audioEl = document.getElementById('songAudio');
            if (audioEl && audioEl.src) audioEl.play().catch(e => console.log);
        }
        if (actionType === 'leave') {
            if (confirm("确定离开吗？您的反馈已记录，感谢参与。")) {
                window.location.href = "about:blank";
            }
        }
    }

    function updateRecommendationPage() {
        if (!userChoice.q1 || userChoice.q2 === null) return;
        const groupKey = getUserGroupKey(userChoice.q1, userChoice.q2);
        const rec = RECOMMENDATION_MAP[groupKey];
        if (!rec) return;
        const song = rec.songName;
        const media = SONG_MEDIA[song] || {};

        document.getElementById('recSongName').innerText = rec.songName;
        document.getElementById('recArtist').innerText = rec.artist;
        document.getElementById('recDesc').innerHTML = rec.description;
        document.getElementById('philosophyQuote').innerHTML = `✨ ${PHILOSOPHY_TEXTS[song] || "旋律承载心境"}`;

        const posterImg = document.getElementById('songPoster');
        const posterPlace = document.getElementById('posterPlaceholder');
        if (media.posterUrl) {
            posterImg.src = media.posterUrl;
            posterImg.style.display = 'block';
            posterPlace.style.display = 'none';
        }
        const audioContainer = document.getElementById('audioPlayerContainer');
        const audioElem = document.getElementById('songAudio');
        if (media.audioUrl) {
            audioElem.src = media.audioUrl;
            audioContainer.style.display = 'block';
        }

        // 绑定按钮
        const listenBtn = document.getElementById('listenTrackBtn');
        const leaveBtn = document.getElementById('leaveTrackBtn');
        const newListen = listenBtn.cloneNode(true);
        const newLeave = leaveBtn.cloneNode(true);
        listenBtn.parentNode.replaceChild(newListen, listenBtn);
        leaveBtn.parentNode.replaceChild(newLeave, leaveBtn);
        newListen.addEventListener('click', () => recordActionAndReport(song, 'listen', groupKey));
        newLeave.addEventListener('click', () => recordActionAndReport(song, 'leave', groupKey));
    }

    // 页面切换
    const pages = {
        1: document.getElementById('page1'),
        2: document.getElementById('page2'),
        3: document.getElementById('page3'),
        4: document.getElementById('page4')
    };
    function showPage(idx) {
        for (let i = 1; i <= 4; i++) if (pages[i]) pages[i].classList.remove('active');
        if (pages[idx]) pages[idx].classList.add('active');
    }

    // 问卷逻辑
    document.getElementById('startBtn').addEventListener('click', () => { fullReset(); showPage(2); });
    const q1Opts = document.querySelectorAll('[data-q1]');
    const toQ2Btn = document.getElementById('toQ2Btn');
    q1Opts.forEach(opt => opt.addEventListener('click', function() {
        q1Opts.forEach(o => o.classList.remove('selected'));
        this.classList.add('selected');
        userChoice.q1 = this.dataset.q1;
        toQ2Btn.classList.remove('inactive');
        toQ2Btn.classList.add('active');
    }));
    toQ2Btn.addEventListener('click', () => { if (userChoice.q1) { renderQ2(); showPage(3); } });

    const q2Div = document.getElementById('q2Options');
    const toResultBtn = document.getElementById('toResultBtn');
    function renderQ2() {
        q2Div.innerHTML = '';
        userChoice.q2 = null;
        toResultBtn.classList.remove('active');
        toResultBtn.classList.add('inactive');
        const isYes = userChoice.q1 === 'yes';
        document.getElementById('dynamicQuestionText').innerText = isYes ? '你今天更想听带歌词的演唱类歌曲吗？' : '你今天更想听热血/节奏感强烈的歌曲吗？';
        q2Div.innerHTML = isYes ? 
            `<div class="option-item" data-q2="yes">是，喜欢演唱类</div><div class="option-item" data-q2="no">否，偏好纯音乐</div>` :
            `<div class="option-item" data-q2="yes">是，热血燃曲</div><div class="option-item" data-q2="no">否，非热血氛围</div>`;
        document.querySelectorAll('[data-q2]').forEach(opt => opt.addEventListener('click', function() {
            document.querySelectorAll('[data-q2]').forEach(o => o.classList.remove('selected'));
            this.classList.add('selected');
            userChoice.q2 = this.dataset.q2 === 'yes';
            toResultBtn.classList.remove('inactive');
            toResultBtn.classList.add('active');
        }));
    }
    toResultBtn.addEventListener('click', () => { if (userChoice.q2 !== null) { updateRecommendationPage(); showPage(4); } });
    document.getElementById('resetAllBtn').addEventListener('click', () => { fullReset(); showPage(1); });
    function fullReset() {
        userChoice = { q1: null, q2: null };
        document.querySelectorAll('.option-item').forEach(o => o.classList.remove('selected'));
        toQ2Btn.classList.remove('active'); toQ2Btn.classList.add('inactive');
        toResultBtn.classList.remove('active'); toResultBtn.classList.add('inactive');
        document.getElementById('recSongName').innerText = '-';
        document.getElementById('recArtist').innerText = '-';
        document.getElementById('recDesc').innerHTML = '根据你的两个选择，精准推送契合度最高的歌曲。';
        document.getElementById('philosophyQuote').innerHTML = '✨ 音乐是灵魂的镜像，此刻的旋律映照你内心的风景。';
        document.getElementById('songPoster').style.display = 'none';
        document.getElementById('posterPlaceholder').style.display = 'flex';
        document.getElementById('audioPlayerContainer').style.display = 'none';
        const audioEl = document.getElementById('songAudio');
        if (audioEl) audioEl.src = '';
    }

    window.addEventListener('load', () => { fullReset(); showPage(1); });
</script>
</body>
</html>
