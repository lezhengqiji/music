<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>瞬时歌荐 · 跨设备测试版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a232e;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            max-width: 560px;
            width: 100%;
            background: white;
            border-radius: 48px;
            padding: 32px 28px 40px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
            text-align: center;
        }
        h1 { font-size: 2.8rem; margin-bottom: 24px; letter-spacing: 2px; }
        .step { color: #2c6e6e; font-weight: 600; margin-bottom: 12px; }
        .question { font-size: 1.6rem; font-weight: 600; margin: 20px 0; }
        .option {
            background: #f0f4f9;
            padding: 14px;
            margin: 12px 0;
            border-radius: 60px;
            cursor: pointer;
            font-weight: 500;
        }
        .option.selected { background: #2c3e4e; color: white; }
        .next-btn {
            background: #2c3e4e;
            color: white;
            padding: 14px;
            border-radius: 60px;
            margin-top: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .next-btn.disabled { opacity: 0.5; pointer-events: none; }
        .test-btn {
            background: #e67e22;
            color: white;
            padding: 16px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: bold;
            margin: 24px 0 16px;
            cursor: pointer;
        }
        .small-note { font-size: 0.75rem; color: #5f7f8c; margin-top: 20px; }
        button { border: none; width: 100%; }
    </style>
</head>
<body>
<div class="card" id="app">
    <div id="page1">
        <h1>瞬时歌荐</h1>
        <div class="next-btn" id="startTestBtn">开始测试</div>
        <div class="small-note">跨设备统计验证版 · 仅测试上报</div>
    </div>

    <div id="page2" style="display:none">
        <div class="step">问题 1/2</div>
        <div class="question">今天听歌偏向安静场景吗？</div>
        <div class="option" data-q1="yes">是 · 安静场景</div>
        <div class="option" data-q1="no">否 · 动态场景</div>
        <div class="next-btn disabled" id="toQ2Btn">下一步</div>
    </div>

    <div id="page3" style="display:none">
        <div class="step">问题 2/2</div>
        <div class="question" id="q2Text">你更想听带歌词的歌曲吗？</div>
        <div id="q2Options"></div>
        <div class="next-btn disabled" id="toResultBtn">查看推荐</div>
    </div>

    <div id="page4" style="display:none">
        <div class="step">🎧 测试推荐</div>
        <div id="recSong" style="font-size:1.8rem; font-weight:bold; margin:12px 0">-</div>
        <div class="test-btn" id="forceReportBtn">📡 点击听取（测试上报）</div>
        <div class="small-note" id="reportStatus"></div>
        <div class="next-btn" id="resetAllBtn" style="background:#ccc; color:#000; margin-top:20px">重新测试</div>
    </div>
</div>

<script>
    // ========= 请把你完整的 Google 表单提交链接粘贴在这里 =========
    const STATS_ENDPOINT = "https://docs.google.com/forms/d/e/1FAIpQLSeqIlRHwtcHMOO161dEM0xBiTEawJzAeZ-iTsfYVMbAEMsO8Q/formResponse?usp=pp_url&entry.998574318={song}&entry.586020648={action}&entry.604430543={group}";
    // ============================================================

    let userChoice = { q1: null, q2: null };
    let currentGroup = "";

    function showPage(id) {
        document.querySelectorAll('#app > div').forEach(div => div.style.display = 'none');
        document.getElementById(id).style.display = 'block';
    }

    // 上报函数（占位符必须替换）
    async function reportTest(song, action, group) {
        let finalUrl = STATS_ENDPOINT
            .replace("{song}", encodeURIComponent(song))
            .replace("{action}", encodeURIComponent(action))
            .replace("{group}", encodeURIComponent(group));

        console.log("📡 上报URL:", finalUrl);
        document.getElementById("reportStatus").innerText = "⏳ 上报中...";
        try {
            await fetch(finalUrl, { method: "GET", mode: "no-cors" });
            document.getElementById("reportStatus").innerHTML = "✅ 上报已发送（请刷新 Google Sheets 查看）";
        } catch(e) {
            document.getElementById("reportStatus").innerHTML = "⚠️ 发送失败，请检查网络";
        }
    }

    // 第四页内容
    function showResultPage() {
        let groupKey = "";
        if (userChoice.q1 === "yes") groupKey = userChoice.q2 ? "C11" : "C10";
        else groupKey = userChoice.q2 ? "C01" : "C00";
        currentGroup = groupKey;
        let songName = "";
        if (groupKey === "C11") songName = "小幸运";
        else if (groupKey === "C10") songName = "River Flows in You";
        else if (groupKey === "C01") songName = "孤勇者";
        else songName = "大风吹";
        document.getElementById("recSong").innerHTML = `${songName} · ${groupKey}`;
        showPage("page4");

        const btn = document.getElementById("forceReportBtn");
        const newBtn = btn.cloneNode(true);
        btn.parentNode.replaceChild(newBtn, btn);
        newBtn.id = "forceReportBtn";
        newBtn.addEventListener("click", () => {
            reportTest(songName, "listen", groupKey);
        });
    }

    // 问卷逻辑
    const q1Opts = document.querySelectorAll('[data-q1]');
    let selectedQ1 = false;
    q1Opts.forEach(opt => {
        opt.addEventListener("click", function() {
            q1Opts.forEach(o => o.classList.remove("selected"));
            this.classList.add("selected");
            userChoice.q1 = this.getAttribute("data-q1");
            const btn = document.getElementById("toQ2Btn");
            btn.classList.remove("disabled");
        });
    });
    document.getElementById("toQ2Btn").addEventListener("click", () => {
        if (!userChoice.q1) return;
        renderQ2();
        showPage("page3");
    });

    function renderQ2() {
        const container = document.getElementById("q2Options");
        const q2Text = document.getElementById("q2Text");
        if (userChoice.q1 === "yes") {
            q2Text.innerText = "你今天更想听带歌词的歌曲吗？";
            container.innerHTML = `<div class="option" data-q2="yes">是 · 带歌词</div><div class="option" data-q2="no">否 · 纯音乐</div>`;
        } else {
            q2Text.innerText = "你今天更想听热血节奏感的歌曲吗？";
            container.innerHTML = `<div class="option" data-q2="yes">是 · 热血</div><div class="option" data-q2="no">否 · 非热血</div>`;
        }
        document.querySelectorAll('[data-q2]').forEach(opt => {
            opt.addEventListener("click", function() {
                document.querySelectorAll('[data-q2]').forEach(o => o.classList.remove("selected"));
                this.classList.add("selected");
                userChoice.q2 = this.getAttribute("data-q2") === "yes";
                const btn = document.getElementById("toResultBtn");
                btn.classList.remove("disabled");
            });
        });
    }
    document.getElementById("toResultBtn").addEventListener("click", () => {
        if (userChoice.q2 === null) return;
        showResultPage();
    });
    document.getElementById("resetAllBtn").addEventListener("click", () => {
        userChoice = { q1: null, q2: null };
        document.querySelectorAll('.option').forEach(o => o.classList.remove("selected"));
        showPage("page1");
    });
    document.getElementById("startTestBtn").addEventListener("click", () => showPage("page2"));
</script>
</body>
</html>
